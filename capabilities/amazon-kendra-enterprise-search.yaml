naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Kendra Enterprise Search"
  description: "Unified workflow capability for Amazon Kendra enterprise search, combining index management, data source connectivity, document indexing, and intelligent query operations for knowledge management and RAG workflows."
  tags:
    - Amazon Kendra
    - Enterprise Search
    - Machine Learning
    - AWS
    - Knowledge Management
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY

capability:
  consumes:
    - import: kendra
      location: ./shared/kendra.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: kendra-search-api
      description: "Unified REST API for Amazon Kendra enterprise search operations."
      resources:
        - path: /v1/indexes
          name: indexes
          description: "Search index management"
          operations:
            - method: POST
              name: create-index
              description: "Create a new search index"
              call: "kendra.create-index"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: list-indexes
              description: "List all search indexes"
              call: "kendra.list-indexes"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/indexes/{IndexId}/query
          name: search
          description: "Intelligent search"
          operations:
            - method: POST
              name: search
              description: "Search an index with natural language"
              call: "kendra.query"
              with:
                IndexId: "rest.IndexId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/indexes/{IndexId}/data-sources
          name: data-sources
          description: "Data source connector management"
          operations:
            - method: POST
              name: create-data-source
              description: "Create a data source connector"
              call: "kendra.create-data-source"
              with:
                IndexId: "rest.IndexId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: list-data-sources
              description: "List data source connectors"
              call: "kendra.list-data-sources"
              with:
                IndexId: "rest.IndexId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/indexes/{IndexId}/documents
          name: documents
          description: "Document management"
          operations:
            - method: POST
              name: index-documents
              description: "Add documents to an index"
              call: "kendra.batch-put-document"
              with:
                IndexId: "rest.IndexId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9090
      namespace: kendra-search-mcp
      transport: http
      description: "MCP server for AI-assisted Amazon Kendra search operations."
      tools:
        - name: create-search-index
          description: "Create a new Amazon Kendra enterprise search index"
          hints:
            readOnly: false
            idempotent: false
          call: "kendra.create-index"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-search-indexes
          description: "List all Amazon Kendra search indexes"
          hints:
            readOnly: true
            idempotent: true
          call: "kendra.list-indexes"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-index
          description: "Search an Amazon Kendra index using natural language query"
          hints:
            readOnly: true
            openWorld: true
          call: "kendra.query"
          with:
            IndexId: "tools.IndexId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: connect-data-source
          description: "Connect a data repository (S3, SharePoint, Salesforce, etc.) to a Kendra index"
          hints:
            readOnly: false
            idempotent: false
          call: "kendra.create-data-source"
          with:
            IndexId: "tools.IndexId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-data-sources
          description: "List all data source connectors for a Kendra index"
          hints:
            readOnly: true
            idempotent: true
          call: "kendra.list-data-sources"
          with:
            IndexId: "tools.IndexId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: index-documents
          description: "Add documents to an Amazon Kendra search index"
          hints:
            readOnly: false
            idempotent: false
          call: "kendra.batch-put-document"
          with:
            IndexId: "tools.IndexId"
          outputParameters:
            - type: object
              mapping: "$."
