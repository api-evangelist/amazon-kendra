naftiko: 1.0.0-alpha2
info:
  label: Amazon Kendra Enterprise Search
  description: Unified workflow capability for Amazon Kendra enterprise search, combining index management, data source connectivity,
    document indexing, and intelligent query operations for knowledge management and RAG workflows.
  tags:
  - Amazon Kendra
  - Enterprise Search
  - Machine Learning
  - AWS
  - Knowledge Management
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
capability:
  consumes:
  - type: http
    namespace: kendra
    baseUri: https://kendra.us-east-1.amazonaws.com
    description: Amazon Kendra intelligent enterprise search service.
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_ACCESS_KEY_ID}}'
      placement: header
    resources:
    - name: indexes
      path: /indexes
      description: Amazon Kendra search indexes
      operations:
      - name: create-index
        method: POST
        description: Create a new Amazon Kendra search index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-indexes
        method: GET
        description: List all Amazon Kendra indexes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: index
      path: /indexes/{IndexId}
      description: A specific Amazon Kendra search index
      operations:
      - name: describe-index
        method: GET
        description: Get information about an Amazon Kendra index
        inputParameters:
        - name: IndexId
          in: path
          type: string
          required: true
          description: The identifier of the index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-index
        method: DELETE
        description: Delete an Amazon Kendra index
        inputParameters:
        - name: IndexId
          in: path
          type: string
          required: true
          description: The identifier of the index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: data-sources
      path: /indexes/{IndexId}/data-sources
      description: Data source connectors for an index
      operations:
      - name: create-data-source
        method: POST
        description: Create a data source connector
        inputParameters:
        - name: IndexId
          in: path
          type: string
          required: true
          description: The identifier of the index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-data-sources
        method: GET
        description: List data source connectors for an index
        inputParameters:
        - name: IndexId
          in: path
          type: string
          required: true
          description: The identifier of the index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: query
      path: /indexes/{IndexId}/query
      description: Query an Amazon Kendra index
      operations:
      - name: query
        method: POST
        description: Search an index and return relevant documents
        inputParameters:
        - name: IndexId
          in: path
          type: string
          required: true
          description: The identifier of the index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: documents
      path: /indexes/{IndexId}/documents
      description: Documents in an Amazon Kendra index
      operations:
      - name: batch-put-document
        method: POST
        description: Add documents to an index
        inputParameters:
        - name: IndexId
          in: path
          type: string
          required: true
          description: The identifier of the index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: kendra-search-api
    description: Unified REST API for Amazon Kendra enterprise search operations.
    resources:
    - path: /v1/indexes
      name: indexes
      description: Search index management
      operations:
      - method: POST
        name: create-index
        description: Create a new search index
        call: kendra.create-index
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: list-indexes
        description: List all search indexes
        call: kendra.list-indexes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/indexes/{IndexId}/query
      name: search
      description: Intelligent search
      operations:
      - method: POST
        name: search
        description: Search an index with natural language
        call: kendra.query
        with:
          IndexId: rest.IndexId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/indexes/{IndexId}/data-sources
      name: data-sources
      description: Data source connector management
      operations:
      - method: POST
        name: create-data-source
        description: Create a data source connector
        call: kendra.create-data-source
        with:
          IndexId: rest.IndexId
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: list-data-sources
        description: List data source connectors
        call: kendra.list-data-sources
        with:
          IndexId: rest.IndexId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/indexes/{IndexId}/documents
      name: documents
      description: Document management
      operations:
      - method: POST
        name: index-documents
        description: Add documents to an index
        call: kendra.batch-put-document
        with:
          IndexId: rest.IndexId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: kendra-search-mcp
    transport: http
    description: MCP server for AI-assisted Amazon Kendra search operations.
    tools:
    - name: create-search-index
      description: Create a new Amazon Kendra enterprise search index
      hints:
        readOnly: false
        idempotent: false
      call: kendra.create-index
      outputParameters:
      - type: object
        mapping: $.
    - name: list-search-indexes
      description: List all Amazon Kendra search indexes
      hints:
        readOnly: true
        idempotent: true
      call: kendra.list-indexes
      outputParameters:
      - type: object
        mapping: $.
    - name: search-index
      description: Search an Amazon Kendra index using natural language query
      hints:
        readOnly: true
        openWorld: true
      call: kendra.query
      with:
        IndexId: tools.IndexId
      outputParameters:
      - type: object
        mapping: $.
    - name: connect-data-source
      description: Connect a data repository (S3, SharePoint, Salesforce, etc.) to a Kendra index
      hints:
        readOnly: false
        idempotent: false
      call: kendra.create-data-source
      with:
        IndexId: tools.IndexId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-data-sources
      description: List all data source connectors for a Kendra index
      hints:
        readOnly: true
        idempotent: true
      call: kendra.list-data-sources
      with:
        IndexId: tools.IndexId
      outputParameters:
      - type: object
        mapping: $.
    - name: index-documents
      description: Add documents to an Amazon Kendra search index
      hints:
        readOnly: false
        idempotent: false
      call: kendra.batch-put-document
      with:
        IndexId: tools.IndexId
      outputParameters:
      - type: object
        mapping: $.
