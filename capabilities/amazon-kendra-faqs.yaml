        name: describefaq
        description: Amazon Kendra Describe FAQ
        call: amazon-kendra-faqs.describefaq
        with:
          IndexId: rest.IndexId
          FaqId: rest.FaqId
        outputParameters:
        - type: object
          mapping: $.
